services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kedo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: KEDO
      APP_ENV: development
      DEBUG: "true"
      API_V1_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
      # --- Подключение к внешней БД (из другого контейнера) ---
      MAIN_DB_HOST: host.docker.internal   # Windows/Mac
      MAIN_DB_PORT: 5434                   # порт hr_postgres
      MAIN_DB_USER: hr_user
      MAIN_DB_PASSWORD: hr_password
      MAIN_DB_NAME: hr_db
      LOG_DB_HOST: host.docker.internal
      LOG_DB_PORT: 5433                    # порт hr_logs_postgres
      LOG_DB_USER: logs_user
      LOG_DB_PASSWORD: logs_password
      LOG_DB_NAME: logs_db
      # --- JWT ---
      JWT_SECRET_KEY: change-me-to-a-long-random-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontmain
      dockerfile: Dockerfile
    container_name: kedo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  logs_postgres_data:
  backend_uploads:
