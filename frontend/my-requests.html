<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика - Мои заявки</title>
    <style>
        /* Базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827;
            display: flex;
            min-height: 100vh;
        }

        /* Сайдбар */
        .sidebar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: #2563eb;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: #4b5563;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .nav a:hover {
            background-color: #f3f4f6;
        }

        .nav a.active {
            background-color: #eff6ff;
            color: #2563eb;
        }

        /* Основной контент */
        .main-content {
            flex-grow: 1;
            padding: 32px 48px;
            max-width: 1200px;
        }

        /* Заголовок и кнопка */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .btn-primary {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Фильтры (Табы) */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .filter-tab {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .filter-tab.active {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
        }

        /* Таблица заявок */
        .table-container {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 8px 24px;
            background-color: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        td {
            padding: 20px 0;
            font-size: 15px;
            border-bottom: 1px solid #f3f4f6;
            color: #111827;
        }

        td:first-child {
            font-weight: 600;
            width: 25%;
        }

        .request-date {
            color: #6b7280;
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .status.pending {
            background-color: #fef3c7;
            color: #b45309;
        }

        .status.approved {
            background-color: #d1fae5;
            color: #047857;
        }

        .status.rejected {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .status.ready {
            background-color: #e0e7ff;
            color: #4338ca;
        }
    </style>
</head>
<body>

    <!-- Сайдбар -->
    <aside class="sidebar">
        <div class="logo">Практика</div>
        <nav class="nav">
            <a href="dashboard.html">Главная</a>
            <a href="my-requests.html" class="active">Мои заявки</a>
            <a href="documents.html">Документы</a>
            <a href="profile.html">Профиль</a>
            <a href="hr.html">HR</a> <!-- Если есть такая страница -->
    <a href="admin.html">Админ</a> <!-- ДОБАВИТЬ ЭТУ СТРОКУ -->
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        
        <div class="page-header">
            <h1>Мои заявки</h1>
            <a href="new-request.html" class="btn-primary">Новая заявка</a>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-tab active" onclick="filterRequests('all')">Все</button>
            <button class="filter-tab" onclick="filterRequests('pending')">На рассмотрении</button>
            <button class="filter-tab" onclick="filterRequests('approved')">Одобрено</button>
            <button class="filter-tab" onclick="filterRequests('rejected')">Отклонено</button>
        </div>

        <!-- Таблица -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Тип</th>
                        <th>Период</th>
                        <th>Дата подачи</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody id="requests-table-body">
                    <!-- Данные подставит JS -->
                </tbody>
            </table>
        </div>

    </main>

    <script>
        // ==========================================
        // ВРЕМЕННАЯ ЗАТЫЧКА (TODO: Заменить на реальные API запросы к бэкенду)
        // ==========================================
        
        // Данные о заявках (придут из БД)
        let requestsData = [
    { id: 1, type: "Отпуск", period: "10.03 — 24.03.2026", date: "05.03.2026", status: "На рассмотрении", class: "pending" },
    { id: 2, type: "Больничный", period: "01.02 — 05.02.2026", date: "01.02.2026", status: "Одобрено", class: "approved" },
    { id: 3, type: "Отпуск", period: "20.12 — 03.01.2026", date: "10.12.2025", status: "Отклонено", class: "rejected" },
    { id: 4, type: "Справка 2-НДФЛ", period: "—", date: "20.01.2026", status: "Готово", class: "ready" }
];

        function renderTable(filter = 'all') {
    const tbody = document.getElementById('requests-table-body');
    tbody.innerHTML = ''; 

    requestsData.forEach(req => {
        if (filter !== 'all' && req.class !== filter) {
            return;
        }

        const row = document.createElement('tr');
        
        // Делаем строку кликабельной и передаем ID заявки в функцию
        row.style.cursor = 'pointer';
        row.onclick = () => openRequest(req.id);

        row.innerHTML = `
            <td>${req.type}</td>
            <td class="request-date">${req.period}</td>
            <td class="request-date">${req.date}</td>
            <td><span class="status ${req.class}">${req.status}</span></td>
        `;
        tbody.appendChild(row);
    });
}

// Функция перехода на страницу деталей
function openRequest(id) {
    // Переходим на страницу деталей, передавая ID в URL
    window.location.href = `request-detail.html?id=${id}`;
}

        // Функция переключения фильтров
        function filterRequests(filterType) {
            // Обновляем активный класс на кнопках
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Находим нажатую кнопку и делаем её активной
            event.target.classList.add('active');

            // Перерисовываем таблицу
            renderTable(filterType);
        }

        // Первичная отрисовка при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => renderTable('all'));
    </script>
</body>
</html>
