<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практика - Документы</title>
    <style>
        /* Базовые стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #111827;
            display: flex;
            min-height: 100vh;
        }

        /* Сайдбар */
        .sidebar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            color: #2563eb;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav a {
            display: block;
            padding: 12px 16px;
            text-decoration: none;
            color: #4b5563;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .nav a:hover {
            background-color: #f3f4f6;
        }

        .nav a.active {
            background-color: #eff6ff;
            color: #2563eb;
        }

        /* Основной контент */
        .main-content {
            flex-grow: 1;
            padding: 32px 48px;
            max-width: 1100px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        /* Фильтры (Табы) */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        .filter-tab {
            background: none;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-tab:hover {
            background-color: #f3f4f6;
            color: #111827;
        }

        .filter-tab.active {
            background-color: #2563eb;
            color: white;
            font-weight: 600;
        }

        /* Таблица документов */
        .table-container {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 8px 24px;
            background-color: #ffffff;
            margin-bottom: 32px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 13px;
            color: #9ca3af;
            font-weight: 500;
            padding: 16px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        td {
            padding: 20px 0;
            font-size: 15px;
            border-bottom: 1px solid #f3f4f6;
            color: #111827;
            vertical-align: middle;
        }

        /* Стили для разных колонок */
        .doc-title {
            font-weight: 600;
            width: 30%;
        }

        .doc-date {
            color: #6b7280;
            font-size: 14px;
            width: 15%;
        }

        /* Статусы */
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            width: 15%;
        }

        .status.pending {
            background-color: #fef3c7;
            color: #b45309;
        }

        .status.signed {
            background-color: #d1fae5;
            color: #047857;
        }

        .status.ready {
            background-color: #e0e7ff;
            color: #4338ca;
        }

        /* Кнопки действий */
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-action {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            color: #111827;
        }

        .btn-action:hover {
            background-color: #f9fafb;
            border-color: #9ca3af;
        }

        .btn-action.blue {
            color: #2563eb;
            border-color: #dbeafe;
            background-color: #eff6ff;
        }

        .btn-action.blue:hover {
            background-color: #dbeafe;
        }

        /* Красная кнопка PDF */
        .btn-pdf {
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-pdf:hover {
            background-color: #dc2626;
        }

        /* Кнопка Назад */
        .btn-back {
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-back:hover {
            background-color: #b91c1c;
        }

        /* Скрытие строк при фильтрации */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Сайдбар -->
    <aside class="sidebar">
        <div class="logo">Практика</div>
        <nav class="nav">
            <a href="dashboard.html">Главная</a>
            <a href="my-requests.html">Мои заявки</a>
            <a href="documents.html" class="active">Документы</a>
            <a href="profile.html">Профиль</a>
            <a href="hr.html">HR</a> <!-- Если есть такая страница -->
    <a href="admin.html">Админ</a> <!-- ДОБАВИТЬ ЭТУ СТРОКУ -->
        </nav>
    </aside>

    <!-- Основной контент -->
    <main class="main-content">
        <h1>Документы</h1>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-tab active" onclick="filterDocs('all')">Все</button>
            <button class="filter-tab" onclick="filterDocs('pending')">На подпись</button>
            <button class="filter-tab" onclick="filterDocs('signed')">Подписанные</button>
        </div>

        <!-- Таблица -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Дата</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="docs-table-body">
                    <!-- Данные подставит JS -->
                </tbody>
            </table>
        </div>

        <!-- Кнопка Назад -->
        <button class="btn-back" onclick="goBack()">Назад</button>

    </main>

    <script>
        // ==========================================
        // ВРЕМЕННАЯ ЗАТЫЧКА (TODO: Заменить на реальные API запросы к бэкенду)
        // ==========================================
        
        // Данные о документах (придут из БД)
        let docsData = [
            { 
                title: "Приказ о предоставлении отпуска", 
                date: "05.03.2026", 
                status: "На подпись", 
                class: "pending",
                actions: ['sign', 'edit', 'pdf'] // Кнопки: подписать, редактировать, скачать PDF
            },
            { 
                title: "Заявление на отпуск", 
                date: "05.03.2026", 
                status: "Подписан", 
                class: "signed",
                actions: ['pdf']
            },
            { 
                title: "Справка 2-НДФЛ", 
                date: "20.01.2026", 
                status: "Готово", 
                class: "ready",
                actions: ['pdf']
            }
        ];

        // Функция для отрисовки таблицы с учетом фильтра
        function renderTable(filter = 'all') {
            const tbody = document.getElementById('docs-table-body');
            tbody.innerHTML = ''; // Очищаем таблицу

            docsData.forEach(doc => {
                // Если фильтр не 'all' и статус не совпадает, пропускаем
                if (filter !== 'all' && doc.class !== filter) {
                    return;
                }

                const row = document.createElement('tr');
                
                // Генерируем HTML для кнопок действий
                let actionsHtml = '<div class="actions">';
                
                if (doc.actions.includes('sign')) {
                    actionsHtml += `<button class="btn-action">Подписать</button>`;
                }
                if (doc.actions.includes('edit')) {
                    actionsHtml += `<button class="btn-action blue">Редактировать</button>`;
                }
                if (doc.actions.includes('pdf')) {
                    actionsHtml += `<button class="btn-pdf">PDF</button>`;
                }
                
                actionsHtml += '</div>';

                row.innerHTML = `
                    <td class="doc-title">${doc.title}</td>
                    <td class="doc-date">${doc.date}</td>
                    <td><span class="status ${doc.class}">${doc.status}</span></td>
                    <td>${actionsHtml}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Функция переключения фильтров
        function filterDocs(filterType) {
            // Обновляем активный класс на кнопках
            const tabs = document.querySelectorAll('.filter-tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            // Находим нажатую кнопку и делаем её активной
            event.target.classList.add('active');

            // Перерисовываем таблицу
            renderTable(filterType);
        }

        // Функция для кнопки "Назад"
        function goBack() {
            // Возвращаем пользователя на предыдущую страницу в истории браузера
            window.history.back();
        }

        // Первичная отрисовка при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => renderTable('all'));
    </script>
</body>
</html>
